<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Puls</title>
<style>
  :root {
    --bg: #000; --text: #fff; --muted: rgba(255,255,255,.55); --glass: rgba(255,255,255,.08); --glass-2: rgba(255,255,255,.14);
    --blue: #0a84ff; --red: #ff453a;
    --z0: #636b78; --z1: #3a9cf0; --z2: #34c76a; --z3: #f5c530; --z4: #ff8f1f; --z5: #ff3b30;
    --r: 22px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* ---------- Kacheln ---------- */
  #grid { flex: 1; display: grid; gap: 12px; padding: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); grid-auto-rows: minmax(210px, 1fr); min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .tile { position: relative; border-radius: var(--r); padding: 4% 4.5% 3.5%; display: flex; flex-direction: column; background: var(--z0); color: #fff; transition: background .7s ease; min-height: 210px; container-type: size; overflow: hidden; }
  .tile.light { color: #0b0d10; }
  .tile.stale .bpm, .tile.stale .zone { opacity: .35; }
  .tile.lost { background: var(--z0) !important; color: #fff; }
  .tile.lost .bpm, .tile.lost .zone { opacity: .6; }

  .tile .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .tile .name { font-weight: 700; font-size: clamp(24px, 12cqh, 60px); letter-spacing: -.02em; line-height: 1.1; min-width: 0; flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .tile .mid { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5%; min-height: 0; }
  .tile .bpm { font-weight: 700; line-height: .85; letter-spacing: -.045em; font-size: clamp(84px, 46cqh, 320px); font-variant-numeric: tabular-nums; transition: opacity .4s; }
  .tile .zone { font-weight: 700; font-size: clamp(22px, 10cqh, 52px); letter-spacing: -.02em; line-height: 1.05; transition: opacity .4s; }
  .tile .zone small { display: block; font-weight: 500; font-size: 48%; opacity: .8; margin-top: 5px; letter-spacing: 0; }
  .tile .zone small:empty { display: none; }

  .tile .chart { position: relative; height: 30%; min-height: 64px; background: rgba(0,0,0,.26); border-radius: 14px; overflow: hidden; cursor: pointer; }
  .tile.light .chart { background: rgba(0,0,0,.16); }
  .tile canvas { width: 100%; height: 100%; display: block; }
  .tile .cl { position: absolute; top: 6px; right: 10px; font-size: clamp(12px, 5cqh, 18px); font-weight: 600; color: #fff; opacity: .85; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: none; }
  .tile .zbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 9px; background: rgba(0,0,0,.24); }
  .tile .zbar span { display: block; height: 100%; transition: width .5s; }

  .tile .state { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 500; background: rgba(0,0,0,.5); color: #fff; padding: 6px 12px; border-radius: 999px; white-space: nowrap; backdrop-filter: blur(10px); display: flex; gap: 10px; align-items: center; }
  .tile .state:empty { display: none; }
  .tile .state button { background: #fff; color: #000; border-radius: 999px; padding: 4px 10px; font-weight: 600; }

  /* ---------- Leiste ---------- */
  #bar { display: flex; gap: 10px; padding: 0 12px 12px; align-items: center; flex-wrap: wrap; }
  .group { display: flex; gap: 2px; background: var(--glass); border-radius: 14px; padding: 3px; }
  .btn { height: 44px; padding: 0 16px; border-radius: 11px; font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; color: var(--text); transition: background .15s, opacity .15s; }
  .btn:active { background: var(--glass-2); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--text); color: #000; font-weight: 600; }
  .btn.primary:active { opacity: .8; }
  .btn.on { background: var(--glass-2); }
  .btn.rec { background: var(--red); color: #fff; font-weight: 600; }
  .btn.rec::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .btn svg { width: 18px; height: 18px; fill: currentColor; }
  #timer { font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; padding: 0 10px; min-width: 84px; text-align: center; }
  .spacer { flex: 1; }

  #exitFull { position: fixed; top: calc(14px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right)); z-index: 20; display: none; width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; backdrop-filter: blur(10px); place-items: center; }
  #exitFull svg { width: 20px; height: 20px; fill: currentColor; }
  body.full #bar, body.full #warn { display: none !important; }
  body.full #exitFull { display: grid; opacity: .35; transition: opacity .3s; }
  body.full.show-exit #exitFull { opacity: 1; }

  #warn { display: none; margin: 12px 12px 0; background: rgba(255,69,58,.18); color: #ffd6d0; border-radius: 14px; padding: 12px 14px; line-height: 1.4; font-size: 15px; }
  #warn b { color: #fff; font-weight: 600; }
  #empty { grid-column: 1 / -1; align-self: center; text-align: center; color: var(--muted); font-size: 20px; line-height: 1.5; padding: 40px 24px; max-width: 520px; margin: 0 auto; }
  #empty b { color: var(--text); font-weight: 600; }
  #empty button { color: var(--blue); text-decoration: underline; font-size: 15px; }

  /* ---------- Sheet ---------- */
  #sheetBg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 30; align-items: flex-end; justify-content: center; }
  #sheetBg.open { display: flex; }
  #sheet { width: min(100%, 520px); background: #1c1c1e; border-radius: 22px 22px 0 0; padding: 12px 16px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) { #sheetBg { align-items: center; } #sheet { border-radius: 22px; padding-bottom: 20px; } }
  #sheet h2 { margin: 6px 0 14px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--glass); border-radius: 12px; margin-bottom: 8px; font-size: 16px; }
  .row input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text); font: inherit; font-size: 17px; text-align: right; outline: none; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 36px; height: 36px; border-radius: 10px; background: var(--glass-2); font-size: 20px; font-weight: 600; }
  .stepper output { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 600; }
  .row.action { justify-content: center; font-weight: 600; }
  .row.action.danger { color: var(--red); }
  .row.action.blue { color: var(--blue); }
  #sheet .report { max-height: 60vh; overflow-y: auto; margin-bottom: 8px; }
  #sheet .report img { width: 100%; border-radius: 10px; margin-bottom: 10px; display: block; background: #fff; }
  #sheet textarea { width: 100%; height: 140px; background: var(--glass); color: var(--text); border: 0; border-radius: 12px; padding: 10px; font: 13px/1.4 ui-monospace, monospace; resize: none; margin-bottom: 8px; }
  #sheet .close { display: block; width: 100%; height: 48px; border-radius: 12px; background: var(--glass-2); font-weight: 600; font-size: 16px; margin-top: 4px; }
</style>
</head>
<body>

<div id="warn"></div>

<div id="grid">
  <div id="empty"><b>Noch niemand verbunden.</b><br>Auf der Uhr den Herzfrequenz-Broadcast einschalten, dann unten „Uhr hinzufügen“ – einmal pro Person. Die Aufzeichnung startet von selbst mit dem ersten Puls.<p id="autoHint" style="font-size:15px;margin:16px 0 0;line-height:1.5"></p><p style="margin:14px 0 0"><button id="addAll">Uhr wird nicht gefunden? Alle Bluetooth-Geräte anzeigen</button></p></div>
</div>

<div id="bar">
  <button id="add" class="btn primary">Uhr hinzufügen</button>
  <div class="group">
    <button id="session" class="btn">Training starten</button>
    <div id="timer">00:00</div>
    <button id="reset" class="btn" disabled title="Zurücksetzen"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg></button>
  </div>
  <button id="export" class="btn" disabled>Bericht</button>
  <div class="spacer"></div>
  <button id="full" class="btn">Vollbild</button>
</div>

<button id="exitFull" aria-label="Vollbild beenden"><svg viewBox="0 0 24 24"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg></button>

<div id="sheetBg"><div id="sheet" role="dialog"></div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const grid = $('grid'), empty = $('empty'), warn = $('warn');
  const devices = new Map();
  let wakeLock = null, rangeIdx = 1;
  const RANGES = [{ s: 180, l: '3 min' }, { s: 300, l: '5 min' }, { s: 600, l: '10 min' }, { s: 0, l: 'Gesamt' }];

  // ---------- Zonen (Anteil des Maximalpulses, wie bei Whoop) ----------
  const ZONES = [
    { n: 0, from: 0,    color: '--z0', light: false, label: 'Ruhe' },
    { n: 1, from: .50,  color: '--z1', light: false, label: 'sehr leicht' },
    { n: 2, from: .60,  color: '--z2', light: true,  label: 'leicht' },
    { n: 3, from: .70,  color: '--z3', light: true,  label: 'moderat' },
    { n: 4, from: .80,  color: '--z4', light: true,  label: 'hart' },
    { n: 5, from: .90,  color: '--z5', light: false, label: 'maximal' },
  ];
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const zoneFor = (bpm, max) => { let z = ZONES[0]; for (const zz of ZONES) if (bpm / max >= zz.from) z = zz; return z; };

  // ---------- Speicher ----------
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem('pm:' + k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('pm:' + k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem('pm:' + k); } catch (e) {} }
  };

  // ---------- Sheet (statt prompt/confirm) ----------
  const sheetBg = $('sheetBg'), sheet = $('sheet');
  function openSheet(html, wire) { sheet.innerHTML = html; sheetBg.classList.add('open'); if (wire) wire(sheet); }
  const closeSheet = () => sheetBg.classList.remove('open');
  sheetBg.addEventListener('click', e => { if (e.target === sheetBg) closeSheet(); });
  function confirmSheet(title, text, okLabel, onOk) {
    openSheet(`<h2>${title}</h2><p style="color:var(--muted);margin:0 0 14px;line-height:1.45">${text}</p>
      <button class="row action danger" id="ok">${okLabel}</button><button class="close">Abbrechen</button>`, s => {
      s.querySelector('#ok').onclick = () => { closeSheet(); onOk(); };
      s.querySelector('.close').onclick = closeSheet;
    });
  }

  // ---------- Session ----------
  const session = { running: false, startedAt: 0, elapsed: 0 };
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const now = () => session.elapsed + (session.running ? (Date.now() - session.startedAt) / 1000 : 0);
  function setSessionUI() {
    const b = $('session');
    b.textContent = session.running ? 'Pause' : (session.elapsed ? 'Weiter' : 'Startet automatisch');
    b.classList.toggle('rec', session.running);
    const has = session.elapsed > 0 || session.running;
    $('reset').disabled = !has; $('export').disabled = !has;
  }
  $('session').addEventListener('click', () => {
    if (session.running) { session.elapsed = now(); session.running = false; }
    else { session.running = true; session.startedAt = Date.now(); keepAwake(); }
    setSessionUI(); persist();
  });
  $('reset').addEventListener('click', () => confirmSheet('Training zurücksetzen?', 'Kurven, Zonenzeiten und Timer aller Personen werden gelöscht. Die Uhren bleiben verbunden; die Aufzeichnung startet mit dem nächsten Puls neu.', 'Zurücksetzen', () => {
    session.running = false; session.elapsed = 0;
    for (const e of devices.values()) resetStats(e);
    setSessionUI(); $('timer').textContent = '00:00'; store.del('session');
  }));
  function resetStats(e) { e.samples = []; e.zoneSec = [0,0,0,0,0,0]; e.sum = 0; e.n = 0; e.max = 0; e.lastSampleT = 0; paint(e); }
  setInterval(() => { $('timer').textContent = fmt(now()); }, 500);
  setInterval(() => { if (session.running) for (const e of devices.values()) drawChart(e); }, 2000);

  // Sitzung alle 10 s sichern, damit ein Neuladen nichts verliert
  function persist() {
    const people = {};
    for (const e of devices.values()) { const d = { samples: e.samples, zoneSec: e.zoneSec, sum: e.sum, n: e.n, max: e.max, lastSampleT: e.lastSampleT }; people[e.dev.id] = d; if (e.dev.name) people['name:' + e.dev.name] = d; }
    store.set('session', { elapsed: now(), running: session.running, savedAt: Date.now(), people });
  }
  setInterval(() => { if (session.running) persist(); }, 10000);
  const restored = store.get('session');
  if (restored && restored.elapsed > 0 && Date.now() - restored.savedAt < 6 * 3600 * 1000) {
    session.elapsed = restored.elapsed; setSessionUI();
    warn.style.display = 'block';
    warn.innerHTML = 'Letztes Training (' + fmt(restored.elapsed) + ') wiederhergestellt. Uhren erneut hinzufügen – Kurven laufen weiter. <button id="dropRestore" style="text-decoration:underline;margin-left:8px">Verwerfen</button>';
    $('dropRestore').onclick = () => { session.elapsed = 0; setSessionUI(); store.del('session'); warn.style.display = 'none'; };
  }

  // ---------- Export ----------
  function csv() {
    const rows = ['Person;Sekunde;Uhrzeit;Puls;Zone'];
    const base = Date.now() - now() * 1000;
    for (const e of devices.values()) {
      const name = e.name.replace(/;/g, ',');
      for (const s of e.samples) rows.push(`${name};${Math.round(s.t)};${new Date(base + s.t * 1000).toLocaleTimeString('de-AT')};${s.bpm};${zoneFor(s.bpm, e.maxHR).n}`);
    }
    return rows.join('\n');
  }
  // Ein Blatt pro Person (A4-Hochformat als Bild)
  function renderReport(e) {
    const W = 1240, H = 1754, P = 90;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const dur = now(), zt = e.zoneSec, total = zt.reduce((a, b) => a + b, 0) || 1;
    const col = v => css(v);
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#111'; x.font = '700 78px -apple-system, Helvetica, Arial'; x.fillText(e.name, P, 170);
    x.fillStyle = '#777'; x.font = '400 32px -apple-system, Helvetica, Arial';
    x.fillText(new Date().toLocaleDateString('de-AT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '   ·   Dauer ' + fmt(dur) + '   ·   HFmax ' + e.maxHR, P, 225);
    // Kennzahlen
    const kp = [['Ø Puls', e.n ? Math.round(e.sum / e.n) : '–'], ['Max', e.max || '–'], ['Zeit Zone 4–5', fmt(zt[4] + zt[5])], ['Zeit Zone 3', fmt(zt[3])]];
    kp.forEach((k, i) => {
      const bx = P + i * ((W - 2 * P) / 4);
      x.fillStyle = '#111'; x.font = '700 72px -apple-system, Helvetica, Arial'; x.fillText(String(k[1]), bx, 360);
      x.fillStyle = '#777'; x.font = '400 28px -apple-system, Helvetica, Arial'; x.fillText(k[0], bx, 405);
    });
    // Zonenbalken
    let y = 500;
    x.fillStyle = '#111'; x.font = '600 34px -apple-system, Helvetica, Arial'; x.fillText('Zeit in den Zonen', P, y); y += 40;
    const bw = W - 2 * P - 260;
    for (let i = 5; i >= 0; i--) {
      const frac = zt[i] / total;
      x.fillStyle = col(ZONES[i].color); x.fillRect(P + 150, y, Math.max(6, frac * bw), 44);
      x.fillStyle = '#111'; x.font = '600 30px -apple-system, Helvetica, Arial'; x.fillText('Zone ' + i, P, y + 32);
      x.fillStyle = '#555'; x.font = '400 28px -apple-system, Helvetica, Arial';
      x.fillText(fmt(zt[i]) + '  ·  ' + Math.round(frac * 100) + ' %', P + 150 + Math.max(6, frac * bw) + 18, y + 32);
      y += 62;
    }
    // Pulskurve über das ganze Training
    y += 40;
    x.fillStyle = '#111'; x.font = '600 34px -apple-system, Helvetica, Arial'; x.fillText('Pulsverlauf', P, y); y += 30;
    const cx = P, cy = y, cw = W - 2 * P, ch = H - y - 150;
    const lo = e.maxHR * .45, hi = e.maxHR * 1.02, span = Math.max(dur, 60);
    const yOf = v => cy + ch - ((Math.min(Math.max(v, lo), hi) - lo) / (hi - lo)) * ch;
    const xOf = t => cx + (t / span) * cw;
    for (let i = 0; i < ZONES.length; i++) {
      const from = Math.max(ZONES[i].from * e.maxHR, lo), to = i + 1 < ZONES.length ? ZONES[i + 1].from * e.maxHR : hi;
      x.fillStyle = col(ZONES[i].color); x.globalAlpha = .22; x.fillRect(cx, yOf(to), cw, yOf(from) - yOf(to));
    }
    x.globalAlpha = 1; x.fillStyle = '#666'; x.font = '400 24px -apple-system, Helvetica, Arial'; x.textAlign = 'right';
    for (const z of ZONES.slice(1)) x.fillText(Math.round(z.from * e.maxHR), cx - 12, yOf(z.from * e.maxHR) + 8);
    x.textAlign = 'center';
    const step = span > 3600 ? 600 : span > 1500 ? 300 : 60;
    for (let t = 0; t <= span; t += step) { x.fillStyle = '#666'; x.fillText(fmt(t), xOf(t), cy + ch + 40); x.strokeStyle = 'rgba(0,0,0,.08)'; x.beginPath(); x.moveTo(xOf(t), cy); x.lineTo(xOf(t), cy + ch); x.stroke(); }
    x.textAlign = 'left';
    const pts = e.samples;
    if (pts.length > 1) {
      x.strokeStyle = '#111'; x.lineWidth = 4; x.lineJoin = 'round'; x.lineCap = 'round';
      x.beginPath(); let pen = false;
      for (let i = 0; i < pts.length; i++) {
        if (i && pts[i].t - pts[i - 1].t > 20) pen = false;
        if (!pen) { x.moveTo(xOf(pts[i].t), yOf(pts[i].bpm)); pen = true; } else x.lineTo(xOf(pts[i].t), yOf(pts[i].bpm));
      }
      x.stroke();
    } else { x.fillStyle = '#999'; x.font = '400 30px -apple-system, Helvetica, Arial'; x.fillText('Keine Pulsdaten aufgezeichnet.', cx, cy + ch / 2); }
    x.fillStyle = '#aaa'; x.font = '400 22px -apple-system, Helvetica, Arial';
    x.fillText('Zonen in % der maximalen Herzfrequenz: 1 ≥ 50 %, 2 ≥ 60 %, 3 ≥ 70 %, 4 ≥ 80 %, 5 ≥ 90 %. Lücken = keine Verbindung (z. B. unter Wasser).', P, H - 60);
    return c;
  }
  const toBlob = c => new Promise(r => c.toBlob(r, 'image/png'));
  const safe = t => t.replace(/[^\wäöüÄÖÜß-]+/g, '_');

  $('export').addEventListener('click', async () => {
    const people = [...devices.values()];
    if (!people.length) return;
    const canvases = people.map(e => [e, renderReport(e)]);
    const files = [];
    for (const [e, c] of canvases) files.push(new File([await toBlob(c)], 'Puls-' + safe(e.name) + '.png', { type: 'image/png' }));
    const canShare = navigator.canShare && navigator.canShare({ files });
    openSheet(`<h2>Bericht</h2>
      <div class="report">${canvases.map(([, c]) => `<img src="${c.toDataURL('image/png')}" alt="">`).join('')}</div>
      ${canShare ? '<button class="row action blue" id="sh">Teilen oder sichern</button>' : '<p style="color:var(--muted);font-size:14px;margin:0 0 10px;line-height:1.45">Bild gedrückt halten → „Zu Fotos hinzufügen“ oder „Teilen“.</p>'}
      <button class="row action" id="csv" style="color:var(--muted);font-weight:500">Rohdaten kopieren (CSV)</button>
      <button class="close">Fertig</button>`, s => {
      if (canShare) s.querySelector('#sh').onclick = async () => { try { await navigator.share({ files, title: 'Pulsbericht' }); } catch (x) {} };
      s.querySelector('#csv').onclick = async () => { try { await navigator.clipboard.writeText(csv()); s.querySelector('#csv').textContent = 'Kopiert'; } catch (x) { s.querySelector('#csv').textContent = 'Kopieren nicht möglich'; } };
      s.querySelector('.close').onclick = closeSheet;
    });
  });

  // ---------- Vollbild / Wachhalten ----------
  async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  let exitTimer;
  function showExit() { document.body.classList.add('show-exit'); clearTimeout(exitTimer); exitTimer = setTimeout(() => document.body.classList.remove('show-exit'), 3000); }
  $('full').addEventListener('click', () => {
    document.body.classList.add('full'); showExit();
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => Promise.resolve())).call(el)?.catch?.(() => {});
    setTimeout(() => { for (const e of devices.values()) drawChart(e); }, 300);
  });
  function exitFull() {
    document.body.classList.remove('full', 'show-exit');
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
    setTimeout(() => { for (const e of devices.values()) drawChart(e); }, 300);
  }
  $('exitFull').addEventListener('click', exitFull);
  document.addEventListener('pointerdown', () => { if (document.body.classList.contains('full')) showExit(); });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('full')) exitFull(); });
  window.addEventListener('resize', () => { for (const e of devices.values()) drawChart(e); });

  if (!navigator.bluetooth) {
    warn.style.display = 'block';
    warn.innerHTML = 'Dieser Browser kann kein Web Bluetooth. Am iPhone/iPad die App <b>Bluefy</b> nutzen, sonst Chrome (Android, Windows, Mac).';
    $('add').disabled = $('addAll').disabled = true;
    return;
  }

  // ---------- Kachel ----------
  function makeTile(e) {
    const el = document.createElement('div');
    el.className = 'tile stale';
    el.innerHTML = `
      <div class="state"></div>
      <div class="head"><button class="name" aria-label="Einstellungen"></button></div>
      <div class="mid"><div class="bpm">–</div><div class="zone">Zone –<small></small></div></div>
      <div class="chart"><canvas></canvas><div class="cl"></div></div>
      <div class="zbar">${ZONES.map(z => `<span style="background:var(${z.color});width:0"></span>`).join('')}</div>`;
    el.querySelector('.name').onclick = () => personSheet(e);
    el.querySelector('.chart').onclick = () => { rangeIdx = (rangeIdx + 1) % RANGES.length; for (const x of devices.values()) paint(x); };
    grid.appendChild(el);
    empty.style.display = 'none';
    return el;
  }

  function personSheet(e) {
    openSheet(`<h2>${esc(e.name)}</h2>
      <p style="color:var(--muted);font-size:13px;margin:-8px 4px 12px">Uhr: ${esc(e.dev.name || 'unbekannt')}</p>
      <label class="row">Name <input id="nm" value="${esc(e.name)}" maxlength="24" autocomplete="off"></label>
      <div class="row">Maximalpuls <div class="stepper"><button id="dn">−</button><output id="mx">${e.maxHR}</output><button id="up">+</button></div></div>
      <p style="color:var(--muted);font-size:13px;margin:-2px 4px 12px;line-height:1.4">Faustregel: 220 minus Alter. Davon hängen die Zonen ab.</p>
      <button class="row action blue" id="re">Uhr neu suchen</button>
      <button class="row action danger" id="rm">Person entfernen</button>
      <button class="close">Fertig</button>`, s => {
      const nm = s.querySelector('#nm'), mx = s.querySelector('#mx');
      nm.oninput = () => { e.name = nm.value.trim() || 'Name'; e.el.querySelector('.name').textContent = e.name; s.querySelector('h2').textContent = e.name; saveMeta(e); };
      const step = d => { e.maxHR = Math.min(230, Math.max(120, e.maxHR + d)); mx.textContent = e.maxHR; recomputeZones(e); paint(e); saveMeta(e); };
      s.querySelector('#dn').onclick = () => step(-1); s.querySelector('#up').onclick = () => step(1);
      s.querySelector('#re').onclick = () => { closeSheet(); research(e); };
      s.querySelector('#rm').onclick = () => { closeSheet(); confirmSheet('Person entfernen?', esc(e.name) + ' wird entfernt und die Uhr nicht mehr automatisch verbunden. Name und Maximalpuls bleiben für später gespeichert.', 'Entfernen', () => removePerson(e)); };
      s.querySelector('.close').onclick = closeSheet;
    });
  }
  const saveMeta = e => { const m = { name: e.name, maxHR: e.maxHR }; store.set('dev:' + e.dev.id, m); if (e.dev.name) store.set('name:' + e.dev.name, m); };
  function recomputeZones(e) { e.zoneSec = [0,0,0,0,0,0]; let prev = 0; for (const s of e.samples) { const dt = prev ? Math.min(s.t - prev, 5) : 1; e.zoneSec[zoneFor(s.bpm, e.maxHR).n] += dt; prev = s.t; } }

  function paint(e) {
    const { el, bpm, maxHR } = e;
    el.querySelector('.name').textContent = e.name;
    el.querySelector('.cl').textContent = RANGES[rangeIdx].l + (e.n ? '  ·  Ø ' + Math.round(e.sum / e.n) + '  ·  max ' + e.max : '');
    if (bpm && !el.classList.contains('lost')) {
      const z = zoneFor(bpm, maxHR);
      el.style.background = `var(${z.color})`;
      el.classList.toggle('light', z.light);
      el.querySelector('.bpm').textContent = bpm;
      el.querySelector('.zone').innerHTML = 'Zone ' + z.n + '<small></small>';
    }
    const total = e.zoneSec.reduce((a, b) => a + b, 0) || 1;
    el.querySelectorAll('.zbar span').forEach((s, i) => s.style.width = (e.zoneSec[i] / total * 100) + '%');
    drawChart(e);
  }

  function drawChart(e) {
    const canvas = e.el.querySelector('canvas');
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const t = now(), all = RANGES[rangeIdx].s === 0, span = all ? Math.max(t, 60) : RANGES[rangeIdx].s, t0 = all ? 0 : Math.max(0, t - span);
    const lo = e.maxHR * .45, hi = e.maxHR * 1.02;
    const yOf = v => h - ((Math.min(Math.max(v, lo), hi) - lo) / (hi - lo)) * h;
    const xOf = tt => ((tt - t0) / span) * w;
    // Zonen als Farbbänder über die ganze Höhe
    for (let i = 0; i < ZONES.length; i++) {
      const from = Math.max(ZONES[i].from * e.maxHR, lo), to = i + 1 < ZONES.length ? ZONES[i + 1].from * e.maxHR : hi;
      ctx.fillStyle = css(ZONES[i].color); ctx.globalAlpha = .28;
      ctx.fillRect(0, yOf(to), w, yOf(from) - yOf(to));
    }
    ctx.globalAlpha = .35; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    for (const z of ZONES.slice(1)) { const y = yOf(z.from * e.maxHR); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ctx.globalAlpha = 1;
    const pts = e.samples.filter(s => s.t >= t0 - 5);
    if (pts.length < 2) return;
    // Segmente, bei Lücken (unter Wasser) trennen
    const segs = [[pts[0]]];
    for (let i = 1; i < pts.length; i++) { if (pts[i].t - pts[i - 1].t > 20) segs.push([]); segs[segs.length - 1].push(pts[i]); }
    for (const seg of segs) {
      if (seg.length < 2) continue;
      ctx.beginPath(); ctx.moveTo(xOf(seg[0].t), h);
      for (const p of seg) ctx.lineTo(xOf(p.t), yOf(p.bpm));
      ctx.lineTo(xOf(seg[seg.length - 1].t), h); ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill();
      ctx.beginPath(); seg.forEach((p, i) => i ? ctx.lineTo(xOf(p.t), yOf(p.bpm)) : ctx.moveTo(xOf(p.t), yOf(p.bpm)));
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
    }
    const last = pts[pts.length - 1];
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(xOf(last.t), yOf(last.bpm), 5, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- Bluetooth ----------
  const parseHR = dv => (dv.getUint8(0) & 1) ? dv.getUint16(1, true) : dv.getUint8(1);
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  const setState = (e, text, retry) => {
    const s = e.el.querySelector('.state');
    s.innerHTML = text ? text + (retry ? ' <button>Neu suchen</button>' : '') : '';
    if (retry) s.querySelector('button').onclick = () => research(e);
  };

  function startIfIdle() {
    if (session.running || session.elapsed > 0) return;
    session.running = true; session.startedAt = Date.now(); setSessionUI(); keepAwake();
  }
  function onHR(e, bpm) {
    e.lastData = Date.now();
    if (!bpm || bpm > 250) return;
    startIfIdle();
    e.bpm = bpm;
    e.el.classList.remove('stale', 'lost');
    setState(e, '');
    if (session.running) {
      const t = now();
      if (t - e.lastSampleT >= 1) {
        e.samples.push({ t, bpm });
        e.zoneSec[zoneFor(bpm, e.maxHR).n] += e.lastSampleT ? Math.min(t - e.lastSampleT, 5) : 1;
        e.lastSampleT = t; e.sum += bpm; e.n++; e.max = Math.max(e.max, bpm);
      }
    }
    paint(e);
  }

  async function connect(e) {
    if (e.connecting) return;
    e.connecting = true;
    const gen = e.gen;
    for (let attempt = 1; devices.has(e.dev.id) && e.gen === gen; attempt++) {
      const dev = e.dev;
      try {
        const server = await withTimeout(dev.gatt.connect(), 10000);
        const svc = await withTimeout(server.getPrimaryService('heart_rate'), 8000);
        const ch = await withTimeout(svc.getCharacteristic('heart_rate_measurement'), 8000);
        if (e.ch && e.handler) { try { e.ch.removeEventListener('characteristicvaluechanged', e.handler); } catch (x) {} }
        e.ch = ch; e.handler = ev => onHR(e, parseHR(ev.target.value));
        ch.addEventListener('characteristicvaluechanged', e.handler);
        await withTimeout(ch.startNotifications(), 8000);
        e.lastData = Date.now(); setState(e, '');
        break;
      } catch (err) {
        try { dev.gatt.disconnect(); } catch (x) {}
        if (attempt === 10) setState(e, 'Uhr seit einigen Minuten weg', true);
        await new Promise(r => setTimeout(r, attempt > 6 ? 15000 : Math.min(2000 * attempt, 8000)));
      }
    }
    if (e.gen === gen) e.connecting = false;
  }

  setInterval(() => {
    const t = Date.now();
    for (const e of devices.values()) {
      const ago = (t - e.lastData) / 1000;
      if (ago > 8) e.el.classList.add('stale');
      if (ago > 45 && e.bpm) {
        e.el.classList.add('lost');
        e.el.querySelector('.zone').innerHTML = 'Keine Daten<small>zuletzt ' + e.bpm + ' vor ' + fmt(ago) + '</small>';
      }
      if (!e.connecting && ago > 15) { try { e.dev.gatt.disconnect(); } catch (x) {} connect(e); }
    }
  }, 3000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { wakeLock = null; keepAwake(); for (const e of devices.values()) if (!e.connecting) connect(e); }
  });

  function bind(e, dev) {
    dev.addEventListener('gattserverdisconnected', () => {
      if (e.dev !== dev || !devices.has(dev.id)) return;
      e.el.classList.add('stale');
      setTimeout(() => devices.has(dev.id) && e.dev === dev && connect(e), 1500);
    });
  }
  async function research(e) {
    let nd;
    try { nd = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] }); } catch (x) { warn.style.display = 'block'; warn.textContent = 'Keine Uhr ausgewählt. Sendet sie gerade? Dann noch einmal „Neu suchen“.'; return; }
    if (nd.id !== e.dev.id && devices.has(nd.id)) { warn.style.display = 'block'; warn.textContent = 'Diese Uhr ist schon einer anderen Person zugeordnet.'; return; }
    devices.delete(e.dev.id); forget(e.dev);
    try { e.dev.gatt.disconnect(); } catch (x) {}
    e.dev = nd; e.gen++; e.connecting = false; remember(nd);
    devices.set(nd.id, e); saveMeta(e); bind(e, nd);
    connect(e);
  }
  function removePerson(e) {
    devices.delete(e.dev.id); e.gen++; forget(e.dev);
    try { e.dev.gatt.disconnect(); } catch (x) {}
    e.el.remove();
    if (!devices.size) empty.style.display = 'block';
  }

  const knownIds = () => store.get('known') || [];
  const remember = dev => { const k = knownIds(); if (!k.includes(dev.id)) { k.push(dev.id); store.set('known', k); } };
  const forget = dev => { store.set('known', knownIds().filter(i => i !== dev.id)); try { dev.forget && dev.forget(); } catch (x) {} };
  const loadMeta = dev => store.get('dev:' + dev.id) || (dev.name ? store.get('name:' + dev.name) : null) || {};

  function addDevice(dev, fromPicker) {
    if (devices.has(dev.id)) { if (fromPicker) { warn.style.display = 'block'; warn.textContent = 'Diese Uhr ist schon verbunden (' + devices.get(dev.id).name + ').'; } return devices.get(dev.id); }
    keepAwake(); remember(dev);
    const saved = loadMeta(dev);
    const e = { dev, name: saved.name || dev.name || 'Name', maxHR: saved.maxHR || 190, bpm: 0, lastData: Date.now(), connecting: false, gen: 0,
                samples: [], zoneSec: [0,0,0,0,0,0], sum: 0, n: 0, max: 0, lastSampleT: 0, ch: null, handler: null };
    const r = restored && restored.people && (restored.people[dev.id] || (dev.name && restored.people['name:' + dev.name]));
    if (r && session.elapsed > 0) Object.assign(e, { samples: r.samples || [], zoneSec: r.zoneSec || [0,0,0,0,0,0], sum: r.sum || 0, n: r.n || 0, max: r.max || 0, lastSampleT: r.lastSampleT || 0 });
    e.el = makeTile(e);
    devices.set(dev.id, e);
    paint(e); bind(e, dev); saveMeta(e);
    connect(e);
    if (fromPicker && !saved.name) personSheet(e);
    return e;
  }

  // Auto-Verbindung mit gemerkten Uhren (Chrome mit dauerhaften Berechtigungen)
  async function autoConnect() {
    if (!navigator.bluetooth.getDevices) return;
    let list = [];
    try { list = await navigator.bluetooth.getDevices(); } catch (x) { return; }
    const known = knownIds();
    for (const dev of list) if (known.includes(dev.id)) addDevice(dev);
    if (list.length) $('autoHint').textContent = 'Gemerkte Uhren verbinden sich von selbst, sobald sie senden.';
  }

  async function pick(all) {
    let dev;
    try {
      dev = await navigator.bluetooth.requestDevice(all
        ? { acceptAllDevices: true, optionalServices: ['heart_rate'] }
        : { filters: [{ services: ['heart_rate'] }] });
    } catch (err) {
      warn.style.display = 'block';
      const name = (err && err.name) || (typeof err === 'string' ? err : ''), msg = (err && err.message) || '';
      if (!name && !msg) { warn.innerHTML = 'Verbindung nicht zustande gekommen. Prüfe: Bluetooth am iPad an? Bluefy darf Bluetooth nutzen (iPad-Einstellungen → Bluefy)? Uhr sendet gerade? Dann noch einmal „Uhr hinzufügen“.'; return; }
      if (name === 'NotFoundError') warn.innerHTML = all
        ? 'Auswahl abgebrochen oder kein Gerät gefunden. Ist Bluetooth für diese App erlaubt?'
        : 'Keine Uhr gefunden, die gerade Puls sendet. Broadcast auf der Uhr einschalten – Galaxy Watch: „Heart for Bluetooth“ starten, Whoop: Heart Rate Broadcast. Die Uhr darf nicht in den Bluetooth-Einstellungen des iPads gekoppelt sein.';
      else if (name === 'SecurityError') warn.innerHTML = 'Bluetooth ist hier gesperrt – die Seite muss über <b>https</b> geöffnet sein.';
      else if (name === 'NotAllowedError') warn.innerHTML = 'Bluetooth-Zugriff wurde verweigert. iPad-Einstellungen → Bluefy → Bluetooth erlauben.';
      else warn.innerHTML = 'Fehler: <b>' + esc(name || 'unbekannt') + '</b> ' + esc(msg);
      return;
    }
    warn.style.display = 'none';
    addDevice(dev, true);
  }
  $('add').addEventListener('click', () => pick(false));
  $('addAll').addEventListener('click', () => pick(true));

  // Hinweis je nach Browser-Fähigkeit
  if (!('wakeLock' in navigator)) { const h = document.createElement('div'); h.style.cssText = 'color:var(--muted);font-size:14px;padding:2px 12px 10px'; h.textContent = 'Damit die Verbindungen halten: am iPad Einstellungen → Anzeige & Helligkeit → Automatische Sperre → Nie.'; $('bar').after(h); }
  if (navigator.bluetooth.getDevices) autoConnect();
  else {
    const k = knownIds().map(id => (store.get('dev:' + id) || {}).name).filter(Boolean);
    $('autoHint').innerHTML = (k.length ? 'Bekannt: <b>' + k.join(', ') + '</b>. ' : '') +
      'Dieser Browser merkt sich Uhren nicht über das Schließen hinaus – nach dem Öffnen jede Uhr einmal antippen. Mit Chrome (Android/PC) geht es automatisch.';
  }
})();
</script>
</body>
</html>
