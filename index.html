<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puls-Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f16;
    --text: #f4f6fa;
    --muted: #8b95a7;
    /* Zonenfarben nach Whoop-Vorbild */
    --z0: #4a5261; --z1: #4a9dd8; --z2: #3ec46d; --z3: #f2c531; --z4: #f58a1f; --z5: #e8323c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Barlow", system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  #grid {
    flex: 1; display: grid; gap: 10px; padding: 10px;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
    grid-auto-rows: 1fr;
  }
  .tile {
    position: relative; border-radius: 22px; padding: 4% 5%;
    display: flex; flex-direction: column; justify-content: space-between;
    background: var(--z0); color: #fff; transition: background .6s;
    min-height: 200px; container-type: size;
  }
  .tile.light { color: #101418; }
  .tile.stale { opacity: .45; }
  .tile .name {
    font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: clamp(28px, 14cqh, 64px);
    background: none; border: 0; color: inherit; width: 100%; padding: 0; outline: none; font-variant: normal;
    text-overflow: ellipsis; line-height: 1;
  }
  .tile .name:focus { text-decoration: underline dotted; }
  .tile .bpm {
    font-family: "Barlow Condensed", sans-serif; font-weight: 700; line-height: .85; letter-spacing: -.02em;
    font-size: clamp(90px, 55cqh, 340px); font-variant-numeric: tabular-nums; text-align: center;
  }
  .tile .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: clamp(18px, 9cqh, 40px); line-height: 1; }
  .tile .zone { font-family: "Barlow Condensed", sans-serif; font-weight: 700; }
  .tile .max { background: none; border: 0; color: inherit; font: inherit; opacity: .75; cursor: pointer; padding: 0; }
  .tile .state { position: absolute; top: 10px; right: 14px; font-size: 14px; opacity: .8; }
  .tile .remove { position: absolute; bottom: 8px; right: 12px; background: none; border: 0; color: inherit; font: inherit; font-size: 13px; opacity: 0; cursor: pointer; }
  .tile:hover .remove, .tile:focus-within .remove { opacity: .7; }

  #bar { display: flex; gap: 8px; padding: 0 10px 10px; align-items: center; }
  #bar button { border: 0; border-radius: 12px; padding: 12px 16px; font: inherit; font-size: 15px; cursor: pointer; background: #1b2230; color: var(--text); }
  #bar #add { background: var(--text); color: var(--bg); font-weight: 500; }
  #bar .spacer { flex: 1; }
  #bar #legend { display: flex; gap: 4px; }
  #legend span { width: 28px; height: 10px; border-radius: 3px; display: block; }

  #warn { display: none; margin: 10px; background: #3a2323; color: #ffd6d0; border-radius: 12px; padding: 12px 14px; line-height: 1.4; font-size: 15px; }
  #warn b { color: #fff; font-weight: 500; }
  #empty { grid-column: 1 / -1; align-self: center; text-align: center; color: var(--muted); font-size: 22px; line-height: 1.5; padding: 40px 20px; }
  body.hide-bar #bar, body.hide-bar #warn { display: none !important; }
</style>
</head>
<body>

<div id="warn"></div>

<div id="grid">
  <div id="empty">Noch niemand verbunden.<br>Auf der Uhr den Herzfrequenz-Broadcast einschalten, dann unten „Uhr verbinden“ – einmal pro Person.</div>
</div>

<div id="bar">
  <button id="add">Uhr verbinden</button>
  <button id="addAll" title="Zum Testen">Alle Geräte</button>
  <div class="spacer"></div>
  <div id="legend" title="Zone 0 bis 5">
    <span style="background:var(--z0)"></span><span style="background:var(--z1)"></span><span style="background:var(--z2)"></span>
    <span style="background:var(--z3)"></span><span style="background:var(--z4)"></span><span style="background:var(--z5)"></span>
  </div>
  <button id="full">Vollbild</button>
</div>

<script>
(() => {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const warn = document.getElementById('warn');
  const add = document.getElementById('add');
  const addAll = document.getElementById('addAll');
  const devices = new Map();
  let wakeLock = null;

  // Zonen wie bei Whoop: Anteil der maximalen Herzfrequenz
  const ZONES = [
    { n: 0, from: 0,    color: '--z0', light: false },
    { n: 1, from: 0.50, color: '--z1', light: false },
    { n: 2, from: 0.60, color: '--z2', light: true  },
    { n: 3, from: 0.70, color: '--z3', light: true  },
    { n: 4, from: 0.80, color: '--z4', light: true  },
    { n: 5, from: 0.90, color: '--z5', light: false },
  ];
  const zoneFor = (bpm, max) => { const p = bpm / max; let z = ZONES[0]; for (const zz of ZONES) if (p >= zz.from) z = zz; return z; };

  // Namen und Max-Puls merken (wenn der Browser das erlaubt)
  const store = { get(k) { try { return JSON.parse(localStorage.getItem('pm:' + k)); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem('pm:' + k, JSON.stringify(v)); } catch (e) {} } };

  if (!navigator.bluetooth) {
    warn.style.display = 'block';
    warn.innerHTML = 'Dieser Browser kann kein Web Bluetooth. Am iPhone die App <b>Bluefy</b> nutzen, sonst Chrome (Android, Windows, Mac).';
    add.disabled = addAll.disabled = true;
    return;
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wakeLock = null; keepAwake(); } });

  document.getElementById('full').addEventListener('click', () => {
    document.body.classList.toggle('hide-bar');
    if (document.body.classList.contains('hide-bar') && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  });
  // Doppeltipp irgendwo bringt die Leiste zurück
  let lastTap = 0;
  document.addEventListener('pointerdown', () => { const t = Date.now(); if (t - lastTap < 350) document.body.classList.remove('hide-bar'); lastTap = t; });

  const parseHR = dv => (dv.getUint8(0) & 1) ? dv.getUint16(1, true) : dv.getUint8(1);

  function makeTile(dev) {
    const saved = store.get(dev.id) || {};
    const el = document.createElement('div');
    el.className = 'tile stale';
    el.innerHTML = `
      <div class="state">Verbinde …</div>
      <input class="name" aria-label="Name">
      <div class="bpm">–</div>
      <div class="foot">
        <div class="zone">Zone –</div>
        <button class="max" title="Maximalpuls ändern">max –</button>
      </div>
      <button class="remove">Entfernen</button>`;
    const name = el.querySelector('.name');
    name.value = saved.name || dev.name || 'Name';
    name.addEventListener('focus', () => name.select());
    grid.appendChild(el);
    empty.style.display = 'none';
    return el;
  }

  function paint(entry) {
    const { el, bpm, maxHR } = entry;
    el.querySelector('.max').textContent = 'max ' + maxHR;
    if (!bpm) return;
    const z = zoneFor(bpm, maxHR);
    el.style.background = `var(${z.color})`;
    el.classList.toggle('light', z.light);
    el.querySelector('.zone').textContent = 'Zone ' + z.n;
    el.querySelector('.bpm').textContent = bpm;
  }

  function onHR(entry, bpm) {
    if (!bpm) return;
    entry.bpm = bpm;
    entry.el.classList.remove('stale');
    paint(entry);
    clearTimeout(entry.staleTimer);
    entry.staleTimer = setTimeout(() => entry.el.classList.add('stale'), 8000);
  }

  async function connect(entry) {
    const { dev, el } = entry;
    const state = el.querySelector('.state');
    try {
      state.textContent = 'Verbinde …';
      const server = await dev.gatt.connect();
      const svc = await server.getPrimaryService('heart_rate');
      const ch = await svc.getCharacteristic('heart_rate_measurement');
      ch.addEventListener('characteristicvaluechanged', e => onHR(entry, parseHR(e.target.value)));
      await ch.startNotifications();
      state.textContent = '';
    } catch (err) {
      state.textContent = 'Keine Verbindung – sendet die Uhr?';
    }
  }

  async function pick(all) {
    let dev;
    try {
      dev = await navigator.bluetooth.requestDevice(all
        ? { acceptAllDevices: true, optionalServices: ['heart_rate'] }
        : { filters: [{ services: ['heart_rate'] }] });
    } catch (e) {
      warn.style.display = 'block';
      if (e.name === 'NotFoundError') {
        warn.innerHTML = all
          ? 'Auswahl abgebrochen oder kein Gerät gefunden. Ist Bluetooth für diese App erlaubt?'
          : 'Keine Uhr gefunden, die gerade Puls sendet. Broadcast auf der Uhr einschalten (Galaxy Watch: „Heart for Bluetooth“ starten) und die Uhr von ihrer eigenen App trennen.';
      } else if (e.name === 'SecurityError') {
        warn.innerHTML = 'Bluetooth ist hier gesperrt – die Seite muss über <b>https</b> oder direkt in Chrome geöffnet sein.';
      } else {
        warn.innerHTML = 'Fehler: <b>' + e.name + '</b> – ' + e.message;
      }
      return;
    }
    warn.style.display = 'none';
    if (devices.has(dev.id)) return;
    keepAwake();

    const saved = store.get(dev.id) || {};
    const el = makeTile(dev);
    const entry = { dev, el, bpm: 0, maxHR: saved.maxHR || 190, staleTimer: null };
    devices.set(dev.id, entry);
    paint(entry);

    const save = () => store.set(dev.id, { name: el.querySelector('.name').value, maxHR: entry.maxHR });
    el.querySelector('.name').addEventListener('change', save);
    el.querySelector('.max').addEventListener('click', () => {
      const v = parseInt(prompt('Maximalpuls für ' + el.querySelector('.name').value + ' (z. B. 220 minus Alter):', entry.maxHR), 10);
      if (v >= 120 && v <= 230) { entry.maxHR = v; paint(entry); save(); }
    });
    el.querySelector('.remove').addEventListener('click', () => {
      devices.delete(dev.id);
      try { dev.gatt.disconnect(); } catch (e) {}
      el.remove();
      if (!devices.size) empty.style.display = 'block';
    });
    dev.addEventListener('gattserverdisconnected', () => {
      if (!devices.has(dev.id)) return;
      el.classList.add('stale');
      el.querySelector('.state').textContent = 'Getrennt – verbinde neu …';
      setTimeout(() => devices.has(dev.id) && connect(entry), 2000);
    });
    await connect(entry);
  }

  add.addEventListener('click', () => pick(false));
  addAll.addEventListener('click', () => pick(true));
})();
</script>
</body>
</html>
